<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- Contact Us Form -->
    <form name="Contact Us" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="Contact Us" />
      <input name="bot-field" />
      <input name="name" />
      <input name="_replyto" />
      <textarea name="message"></textarea>
      <input name="location" />
      <input name="_subject" />
    </form>

    <!-- Newsletter Form -->
    <form name="Newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="Newsletter" />
      <input name="bot-field" />
      <input name="name" />
      <input name="_replyto" />
      <input name="_subject" />
    </form>

    <!-- 3D Request Form -->
    <form name="3D Request Form" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="3D Request Form" />
      <input name="bot-field" />
      <input name="name" />
      <input name="_replyto" />
      <input name="company" />
      <input name="model" />
      <input name="_subject" />
    </form>
  </body>
</html>
